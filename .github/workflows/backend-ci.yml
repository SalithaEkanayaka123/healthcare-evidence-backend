name: Backend CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: evidenceuser
          POSTGRES_PASSWORD: password
          POSTGRES_DB: evidencedb
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U evidenceuser -d evidencedb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_NAME: Healthcare Evidence Backend
      APP_VERSION: 1.0.0
      DATABASE_URL: postgresql+psycopg2://evidenceuser:password@localhost:5433/evidencedb

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m pytest